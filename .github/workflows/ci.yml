name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  LLM_ENABLED: "false"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile rules
        working-directory: .
        run: python scripts/compile_rules.py

      - name: Run tests
        run: pytest -v

      - name: Validate rulebook
        run: |
          python -c "from app.engine.loader import RulebookLoader; loader = RulebookLoader('../rules/compiled/compiled_rulebook.json', '../rules/schema/rulebook.schema.json'); rb = loader.load(); print(f'Validated: {len(rb.triage_pathways)} pathways, {len(rb.lab_tests)} labs')"

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  frontend-e2e:
    if: false  # Temporarily disabled - slow in CI
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - name: Compile rules
        working-directory: .
        run: python scripts/compile_rules.py

      - name: Install frontend dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          cd ../backend
          LLM_ENABLED=false uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/api/v1/health || exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    if: false  # Temporarily disabled - slow in CI
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for rule compilation
        run: pip install pyyaml

      - name: Compile rules
        run: python scripts/compile_rules.py

      - name: Build backend image
        run: docker build -t asclepius-backend ./backend

      - name: Build frontend image
        run: docker build -t asclepius-frontend ./frontend
